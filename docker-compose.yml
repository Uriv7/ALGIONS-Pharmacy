version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://algions_admin:algions_secret@postgres:5432/algions_pharmacy
      - JWT_SECRET=algions_production_super_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: algions_admin
      POSTGRES_PASSWORD: algions_secret
      POSTGRES_DB: algions_pharmacy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algions_admin -d algions_pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
