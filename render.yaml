services:
  - type: web
    name: algions-pharmacy-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @algions/api... build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: algions-pharmacy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: algions-pharmacy-db
    plan: free
    databaseName: algions_pharmacy
    user: algions_user
